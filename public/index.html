<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#18181b">
    <title>Portfolio build</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="site-shell">
      <header class="status-bar" aria-label="Build status">
        <p>Portfolio / foundation</p>
        <p>Connected / not published</p>
      </header>

      <section class="stage" aria-labelledby="page-title">
        <p class="eyebrow">Build state 001</p>
        <h1 id="page-title">Foundation<br>ready.</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="note">The deployable shell is in place. Portfolio content remains intentionally unpublished.</p>
      </section>

      <footer class="footer">
        <p>12 column system</p>
        <p>Responsive foundation</p>
      </footer>
    </main>
  </body>
</html>
