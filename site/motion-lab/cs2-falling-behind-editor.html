<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling behind editor</title>
<style id="fonts"></style>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #101012; color: #d9d9de; font: 12px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  [hidden] { display: none !important; }
  .toolbar { grid-row: 1; } .pastebar { grid-row: 2; } .main { grid-row: 3; } .tl { grid-row: 4; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: #1d1d21; border: 1px solid #303036; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #26262b; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #09c916; outline-offset: 1px; }
  button.primary { background: #09c916; border-color: #09c916; color: #08120a; font-weight: 600; }
  button.toggle[aria-pressed="true"] { background: #1f2a20; border-color: #2f6b33; color: #bff5c3; }
  button.ghost { background: none; border-color: transparent; color: #8c8c95; padding: 2px 6px; }
  button.ghost:hover { color: #f1f1f4; background: #222226; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #222227; background: #141417; }
  .toolbar strong { font-size: 13px; color: #f1f1f4; margin-right: 10px; }
  .toolbar .sep { width: 1px; height: 20px; background: #2a2a30; margin: 0 6px; }
  .toolbar .sp { flex: 1; }
  .pastebar { display: none; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #222227; background: #121214; align-items: flex-start; }
  .pastebar.open { display: flex; }
  .pastebar textarea { flex: 1; height: 90px; box-sizing: border-box; background: #0f0f11; border: 1px solid #2c2c32; border-radius: 6px; font: 11px ui-monospace, Menlo, monospace; padding: 6px; resize: vertical; }
  .pastebar .col { display: flex; flex-direction: column; gap: 6px; width: 220px; }
  .pastebar .msg { color: #e0716d; min-height: 16px; }

  /* Middle: scene list, canvas, properties */
  .main { display: grid; min-height: 0; grid-template-rows: minmax(0, 1fr); grid-template-columns: 220px 5px 1fr 5px 320px; }
  .panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #141417; overflow: hidden; }
  .panel > header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid #222227; color: #f1f1f4; font-weight: 600; }
  .panel > header .sp { flex: 1; }
  .panel .scroll { flex: 1; overflow: auto; min-height: 0; }
  .handle { cursor: col-resize; background: #18181b; }
  .handle:hover, .handle.drag { background: #09c91633; }
  .left { grid-column: 1; } .hl { grid-column: 2; } .stage { grid-column: 3; } .hr { grid-column: 4; } .right { grid-column: 5; }
  .left, .hl, .stage, .hr, .right { grid-row: 1; }
  .main.noleft .left, .main.noleft .hl, .main.noright .right, .main.noright .hr { display: none; }

  .list { list-style: none; margin: 0; padding: 4px 0; }
  .list li { display: flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; height: 28px; cursor: pointer; color: #c4c4cb; border-left: 2px solid transparent; }
  .list li:hover { background: #1b1b1f; }
  .list li.on { background: #1f2a20; color: #f1f1f4; border-left-color: #09c916; }
  .list li.off .nm { color: #5e5e66; text-decoration: line-through; }
  .list li .nm { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .list li.child .nm { padding-left: 14px; }
  .list li .eye { width: 26px; height: 22px; padding: 0; background: none; border: 0; color: #7d7d86; display: flex; align-items: center; justify-content: center; }
  .list li .eye:hover { color: #f1f1f4; }
  .list li .eye svg { width: 15px; height: 15px; }

  .stage { min-width: 0; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .stage .hint { position: absolute; left: 12px; top: 8px; color: #6f6f78; pointer-events: none; }
  #frame { flex: none; box-shadow: 0 0 0 1px #2a2a30; }
  #frame.selfield { box-shadow: 0 0 0 2px #09c916; }
  #frame [data-key] { cursor: grab; }
  #frame [data-key]:hover, #frame .hov { outline: 1px dashed #09c91699; outline-offset: 3px; }
  #frame .sel { outline: 1px solid #09c916 !important; outline-offset: 3px; }
  #frame .selarrive { outline: 1px dashed #09c916 !important; outline-offset: 6px; }
  #frame .selchip { outline: 1px solid #09c916; outline-offset: 2px; }

  /* Properties */
  .tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid #222227; }
  .tabs button { border: 0; border-radius: 6px 6px 0 0; background: none; color: #8c8c95; padding: 6px 12px; border-bottom: 2px solid transparent; }
  .tabs button.on { color: #f1f1f4; border-bottom-color: #09c916; }
  .sect { padding: 6px 0 10px; border-bottom: 1px solid #1f1f24; }
  .sect h3 { margin: 0; padding: 6px 12px 2px; font-size: 11px; font-weight: 600; color: #f1f1f4; display: flex; gap: 8px; align-items: baseline; }
  .sect h3 .shared { font-weight: 400; color: #e3b23c; }
  .sect .note { padding: 2px 12px 6px; color: #7d7d86; }
  .row { display: grid; grid-template-columns: 112px 1fr 56px; gap: 8px; align-items: center; padding: 3px 12px; }
  .row label { color: #a9a9b2; }
  .row input[type=range] { width: 100%; margin: 0; accent-color: #09c916; }
  .row input[type=number], .row input[type=text], .row select { width: 100%; box-sizing: border-box; background: #1b1b1f; border: 1px solid #2c2c32; border-radius: 5px; padding: 3px 6px; }
  .row.wide { grid-template-columns: 112px 1fr; }
  .row.color { grid-template-columns: 112px 28px 1fr; }
  .row.xy { grid-template-columns: 112px 1fr 1fr; }
  .row.live label { color: #09c916; }
  .row input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid #2c2c32; border-radius: 5px; background: none; }
  .row input[type=checkbox] { justify-self: start; accent-color: #09c916; }
  .bad { border-color: #c0504d !important; }
  .styles { padding: 2px 12px; display: grid; gap: 4px; }
  .styles label { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 5px; color: #c4c4cb; cursor: pointer; }
  .styles label:hover { background: #1b1b1f; }
  .styles input { accent-color: #09c916; margin: 0; }

  /* Timeline */
  .tl { border-top: 1px solid #222227; background: #141417; }
  .transport { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #1f1f24; }
  .transport select { background: #1b1b1f; border: 1px solid #2c2c32; border-radius: 5px; padding: 3px 6px; }
  .transport .phase { color: #09c916; font-weight: 600; min-width: 80px; margin-left: 8px; }
  .transport .time { font-variant-numeric: tabular-nums; color: #9a9aa3; }
  .transport .sp { flex: 1; }
  .transport .tip { color: #6f6f78; }
  .tracks { display: grid; grid-template-columns: 250px 1fr; }
  .names > div, .lanes > div { height: 24px; box-sizing: border-box; border-bottom: 1px solid #1a1a1e; }
  .names > div { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; }
  .names .nm { flex: 1; background: none; border: 0; padding: 0; text-align: left; color: #c4c4cb; }
  .names .nm:hover { color: #f1f1f4; background: none; }
  .names .on .nm { color: #09c916; }
  .names input { width: 52px; box-sizing: border-box; background: #1b1b1f; border: 1px solid #2c2c32; border-radius: 4px; padding: 1px 4px; font-size: 11px; }
  .names .u { color: #6f6f78; font-size: 11px; }
  .lanes { position: relative; margin-right: 16px; }
  .ruler { position: relative; cursor: ew-resize; }
  .ruler span { position: absolute; top: 4px; font-size: 10px; color: #6f6f78; transform: translateX(-50%); pointer-events: none; white-space: nowrap; }
  .ruler i { position: absolute; bottom: 0; width: 1px; height: 6px; background: #3a3a40; pointer-events: none; }
  .lane { position: relative; }
  .lane .tail { position: absolute; top: 9px; height: 6px; border-radius: 3px; background: #2a2a30; pointer-events: none; }
  .lane .bar { position: absolute; top: 4px; height: 16px; border-radius: 4px; background: #34343b; border: 1px solid #4a4a52; box-sizing: border-box; cursor: grab; min-width: 10px; }
  .lane .bar:hover { border-color: #8c8c95; }
  .lane .bar.on { background: #1f4a23; border-color: #09c916; }
  .lane .bar.fixed { cursor: pointer; }
  .lane .bar .edge { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
  .lane .bar .edge.l { left: -3px; } .lane .bar .edge.r { right: -3px; }
  .lanes > .playhead { position: absolute; top: 0; bottom: 0; height: auto; border: 0; width: 1px; background: #09c916; pointer-events: none; }
  .playhead::before { content: ""; position: absolute; top: 0; left: -4px; border: 4px solid transparent; border-top: 6px solid #09c916; }

  .toast { position: fixed; left: 50%; bottom: 190px; transform: translateX(-50%); background: #09c916; color: #08120a; padding: 7px 12px; border-radius: 6px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<header class="toolbar">
  <strong>Falling behind</strong>
  <button id="undo" title="Undo (Cmd Z)">Undo</button>
  <button id="redo" title="Redo (Shift Cmd Z)">Redo</button>
  <span class="sep"></span>
  <button class="primary" id="copy" title="Copy every setting as JSON to paste into the chat">Copy settings</button>
  <button id="pasteBtn" aria-expanded="false">Paste settings</button>
  <button id="resetAll" title="Back to the starting values. Undo brings yours back.">Reset</button>
  <span class="sp"></span>
  <button class="toggle" id="toggleLeft" aria-pressed="true" title="Show or hide the scene list">Scene list</button>
  <button class="toggle" id="toggleRight" aria-pressed="true" title="Show or hide the properties">Properties</button>
</header>
<div class="pastebar" id="pastebar">
  <textarea id="pasteText" spellcheck="false" aria-label="Settings JSON" placeholder="Paste settings JSON here"></textarea>
  <div class="col">
    <div><button class="primary" id="pasteLoad">Load</button> <button id="pasteCancel">Cancel</button></div>
    <div class="msg" id="pasteMsg"></div>
  </div>
</div>
<div class="main" id="main">
  <aside class="panel left">
    <header>Scene<span class="sp"></span><button class="ghost" id="closeLeft" title="Hide the scene list">Hide</button></header>
    <div class="scroll"><ul class="list" id="list" role="listbox" aria-label="Objects in the scene"></ul></div>
  </aside>
  <div class="handle hl" id="hl" title="Drag to resize. Double click to reset."></div>
  <section class="stage" id="stage">
    <span class="hint">Click to select. Drag a label or item to move it.</span>
    <div id="frame"></div>
  </section>
  <div class="handle hr" id="hr" title="Drag to resize. Double click to reset."></div>
  <aside class="panel right">
    <header><span id="propTitle">Scene</span><span class="sp"></span><button class="ghost" id="closeRight" title="Hide the properties">Hide</button></header>
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="props"></div>
  </aside>
</div>
<footer class="tl">
  <div class="transport">
    <button class="primary" id="play" title="Play or pause (Space)">Pause</button>
    <button id="back" title="Back one frame (Left arrow, Shift for ten)">&#9664;</button>
    <button id="fwd" title="Forward one frame (Right arrow, Shift for ten)">&#9654;</button>
    <select id="speed" aria-label="Playback speed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
    <span class="phase" id="phase">Fade in</span>
    <span class="time" id="time">0.00 / 8.0 s</span>
    <span class="sp"></span>
    <span class="tip">Drag a bar to move it, drag its end to lengthen it. Hold Option for fine steps.</span>
  </div>
  <div class="tracks">
    <div class="names" id="names"><div></div></div>
    <div class="lanes" id="lanes"><div class="ruler" id="ruler"></div><div class="playhead" id="playhead"></div></div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<script type="module">
  import { createScene, DEFAULTS, ARRIVE_STYLES, EASES, FONTS, FONT_CSS, timeline } from "./fb-engine.js";
  document.getElementById("fonts").textContent = FONT_CSS;

  const STORE = "fb-editor-v1", UISTORE = "fb-editor-v2:ui";
  const $ = (id) => document.getElementById(id);
  const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) {} };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let S = (() => { try { const s = JSON.parse(localStorage.getItem(STORE)); if (s) return { ...clone(DEFAULTS), ...s }; } catch (e) {} return clone(DEFAULTS); })();
  const frame = $("frame");
  const scene = createScene(frame, S);
  let t = 0, playing = true, last = null, speed = 1, selected = "scene", tab = "Look", preview = null;
  const hidden = new Set();

  // Every setting, with its plain word label and range. Where it lives is decided by PANELS below.
  const SPEC = {
    frameW: ["Width", 360, 1440, 10], frameH: ["Height", 300, 1440, 10], bg: ["Background", "color"],
    loop: ["Loop length s", 3, 20, 0.1], fadeIn: ["Fade in s", 0, 2, 0.05], fadeOutAt: ["Fade out at s", 1, 20, 0.05],
    colW: ["Item width", 160, 340, 1], weekGap: ["Gap between weeks", 0, 200, 1], rowH: ["Item height", 32, 90, 1],
    rowGap: ["Gap between items", 0, 30, 1], labelGap: ["Label to items", 4, 80, 1], radius: ["Corner radius", 0, 30, 1],
    padX: ["Inner padding", 4, 40, 1], shiftY: ["Move all up or down", -200, 200, 1],
    fieldCount: ["How many", 0, 600, 5], sizeMin: ["Smallest px", 1, 6, 1], sizeMax: ["Largest px", 1, 8, 1],
    fieldColor: ["Colour", "color"], opMin: ["Faintest", 0, 1, 0.05], opMax: ["Brightest", 0, 1, 0.05],
    twinkle: ["Twinkle", 0, 1, 0.05], fieldSeed: ["Shuffle pattern", 1, 99, 1],
    drift: ["Drift right px/s", 0, 80, 1], wander: ["Wander up and down px", 0, 60, 1], wanderSpeed: ["Wander speed", 1, 6, 1],
    depth: ["Depth, near moves faster", 0, 1, 0.05], lives: ["Fade in and out per loop", 1, 6, 1],
    labelThis: ["Text", "text"], labelNext: ["Text", "text"],
    labelFont: ["Font", "select", FONTS], labelSize: ["Size px", 10, 40, 1],
    labelWeight: ["Weight", "select", [[400, "Regular"], [500, "Medium"], [600, "Semibold"], [700, "Bold"]]],
    labelCaps: ["All caps", "bool"], labelTracking: ["Letter spacing", -0.05, 0.3, 0.01], labelColor: ["Colour", "color"],
    cardFill: ["Fill", "color"], cardBorder: ["Border", "color"], ring: ["Ring", "color"], checkFill: ["Check", "color"],
    tick: ["Tick", "color"], barTitle: ["Title bar", "color"], barMeta: ["Meta bar", "color"],
    doneDim: ["Finished brightness", 0.1, 1, 0.05], ringSize: ["Ring size", 12, 32, 1], barH: ["Bar thickness", 4, 16, 1],
    lift: ["Lift px", 0, 30, 1], grow: ["Grow while moving", 1, 1.2, 0.01],
    moveEase: ["Move curve", "select", Object.keys(EASES).map((k) => [k, k[0].toUpperCase() + k.slice(1)])],
    makeRoom: ["Next week makes room", "bool"], closeGap: ["This week closes the gap", "bool"],
    chipText: ["Text", "text"], chipSize: ["Text size", 6, 16, 0.5], chipColor: ["Colour", "color"], chipFill: ["Fill", "color"],
    chipTint: ["Tints the item border", 0, 1, 0.05], chipStays: ["Stays after the move", "bool"],
    arriveColor: ["Outline", "color"], ringActive: ["Ring", "color"], outlineWidth: ["Outline width", 0.5, 4, 0.25],
    ringWidth: ["Ring width", 1, 6, 0.25], splitA: ["Split colour 1", "color"], splitB: ["Split colour 2", "color"],
    flickers: ["Flicker count", 1, 16, 1], glitchAmount: ["Glitch strength px", 0, 30, 1], glitchSeed: ["Glitch pattern", 1, 40, 1]
  };

  // The objects in screen order. Ids match the engine's data-key where one exists.
  const OBJECTS = [
    ["scene", "Scene"], ["field", "Background pixels"], ["label:this", "This week label"], ["label:next", "Next week label"],
    ["carry", "Moving item (This week item 1)"], ["this:1", "This week item 2"], ["this:2", "This week item 3"],
    ["next:0", "Next week item 1"], ["next:1", "Next week item 2"], ["next:2", "Next week item 3"],
    ["chip", "Rollover tag", true], ["arrive", "Green arrival", true]
  ];
  const nameOf = (id) => OBJECTS.find((o) => o[0] === id)[1];

  const ITEM_STYLE = { title: "Item style", shared: "applies to all items", keys: ["cardFill", "cardBorder", "ring", "checkFill", "tick", "barTitle", "barMeta", "doneDim", "ringSize", "barH"] };
  const LABEL_STYLE = { title: "Label style", shared: "applies to both labels", keys: ["labelFont", "labelSize", "labelWeight", "labelCaps", "labelTracking", "labelColor"] };
  const pos = (key, title = "Position") => ({ title, pos: key });
  function PANELS(id) {
    if (id === "scene") return { Look: [
      { title: "Frame", keys: ["frameW", "frameH", "bg"] },
      { title: "Timing", keys: ["loop", "fadeIn", "fadeOutAt"] },
      { title: "Layout", keys: ["colW", "weekGap", "rowH", "rowGap", "labelGap", "radius", "padX", "shiftY"] },
      { title: "Positions", resetAll: true }
    ] };
    if (id === "field") return {
      Look: [{ title: "Pixels", keys: ["fieldCount", "sizeMin", "sizeMax", "fieldColor", "opMin", "opMax", "twinkle", "fieldSeed"] }],
      Motion: [{ title: "Movement", keys: ["drift", "wander", "wanderSpeed", "depth", "lives"] }]
    };
    if (id.startsWith("label:")) return { Look: [
      { title: "This label", keys: [id === "label:this" ? "labelThis" : "labelNext"] }, pos(id), LABEL_STYLE
    ] };
    if (id === "carry") return {
      Look: [pos("carry:start", "Start place"), pos("carry:end", "Landing place"), ITEM_STYLE],
      Motion: [{ title: "Move", note: "Timing is on the timeline below.", keys: ["lift", "grow", "moveEase", "makeRoom", "closeGap"] }]
    };
    if (id.startsWith("this:") || id.startsWith("next:")) return { Look: [pos(id), ITEM_STYLE] };
    if (id === "chip") return {
      Look: [{ title: "Tag", keys: ["chipText", "chipSize", "chipColor", "chipFill", "chipTint"] }],
      Motion: [{ title: "After the move", note: "When it appears is on the timeline below.", keys: ["chipStays"] }]
    };
    if (id === "arrive") return {
      Look: [{ title: "Colours and weight", keys: ["arriveColor", "ringActive", "outlineWidth", "ringWidth", "splitA", "splitB"] }],
      Motion: [{ title: "Effect", styles: true }, { title: "Glitch", note: "Length is on the timeline below.", keys: ["flickers", "glitchAmount", "glitchSeed"] }]
    };
  }

  // Timed events, one bar each. obj is what a click on the bar selects.
  const land = () => S.moveAt + S.moveDur;
  const EVENTS = [
    { name: "Last check", obj: "this:2", start: "checkAt" },
    { name: "Tag appears", obj: "chip", start: "tagAt", tail: () => (S.chipStays ? S.loop : land()) },
    { name: "Lift", obj: "carry", start: "liftAt", tail: land },
    { name: "Move", obj: "carry", start: "moveAt", dur: "moveDur", minDur: 0.2 },
    { name: "Green arrival", obj: "arrive", from: land, dur: "arriveDur", minDur: 0 }
  ];

  // Controls
  const inputs = {};
  const hexOk = (v) => { v = String(v).trim().replace(/^#/, ""); if (/^[0-9a-f]{3}$/i.test(v)) v = v.split("").map((c) => c + c).join(""); return /^[0-9a-f]{6}$/i.test(v) ? "#" + v.toLowerCase() : null; };
  function control(key) {
    const [label, a, b, step] = SPEC[key];
    const row = document.createElement("div"); row.className = "row"; row.dataset.key = key;
    const lb = document.createElement("label"); lb.textContent = label; lb.htmlFor = "c_" + key; row.appendChild(lb);
    if (a === "color") {
      row.classList.add("color");
      const sw = document.createElement("input"); sw.type = "color"; sw.id = "c_" + key;
      const tx = document.createElement("input"); tx.type = "text"; tx.spellcheck = false; tx.setAttribute("aria-label", label + " hex");
      sw.oninput = () => { tx.value = sw.value; set(key, sw.value); };
      sw.onchange = () => commit();
      tx.onchange = () => { const h = hexOk(tx.value); tx.classList.toggle("bad", !h); if (h) { sw.value = h; tx.value = h; set(key, h); commit(); } };
      row.append(sw, tx); inputs[key] = () => { sw.value = S[key]; tx.value = S[key]; tx.classList.remove("bad"); };
    } else if (a === "text") {
      row.classList.add("wide");
      const tx = document.createElement("input"); tx.type = "text"; tx.id = "c_" + key;
      tx.oninput = () => set(key, tx.value); tx.onchange = () => commit();
      row.appendChild(tx); inputs[key] = () => { tx.value = S[key]; };
    } else if (a === "bool") {
      row.classList.add("wide");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "c_" + key;
      cb.onchange = () => { set(key, cb.checked); commit(); };
      row.appendChild(cb); inputs[key] = () => { cb.checked = !!S[key]; };
    } else if (a === "select") {
      row.classList.add("wide");
      const sel = document.createElement("select"); sel.id = "c_" + key;
      b.forEach(([v, n]) => { const o = document.createElement("option"); o.value = v; o.textContent = n; sel.appendChild(o); });
      sel.onchange = () => { set(key, typeof DEFAULTS[key] === "number" ? Number(sel.value) : sel.value); commit(); };
      row.appendChild(sel); inputs[key] = () => { sel.value = String(S[key]); };
    } else {
      const r = document.createElement("input"); r.type = "range"; r.min = a; r.max = b; r.step = step; r.id = "c_" + key;
      const n = document.createElement("input"); n.type = "number"; n.step = step; n.setAttribute("aria-label", label);
      r.oninput = () => { n.value = r.value; set(key, Number(r.value)); };
      r.onchange = () => commit();
      n.onchange = () => { const v = Number(n.value); if (!isNaN(v)) { r.value = v; set(key, v); commit(); } };
      row.append(r, n); inputs[key] = () => { r.value = S[key]; n.value = S[key]; };
    }
    inputs[key]();
    return row;
  }

  function posRows(key) {
    const box = document.createElement("div");
    const o = S.offsets[key] || { x: 0, y: 0 };
    const row = document.createElement("div"); row.className = "row xy"; row.dataset.key = "offsets"; row.dataset.pos = key;
    const lb = document.createElement("label"); lb.textContent = "Nudge x, y px"; row.appendChild(lb);
    ["x", "y"].forEach((ax) => {
      const n = document.createElement("input"); n.type = "number"; n.value = o[ax]; n.setAttribute("aria-label", "Nudge " + ax);
      n.onchange = () => { const cur = S.offsets[key] || { x: 0, y: 0 }; S.offsets = { ...S.offsets, [key]: { ...cur, [ax]: Number(n.value) || 0 } }; apply(false); commit(); };
      row.appendChild(n);
    });
    const r2 = document.createElement("div"); r2.className = "row wide";
    const sp = document.createElement("span");
    const rs = document.createElement("button"); rs.textContent = "Reset position";
    rs.onclick = () => { const o2 = { ...S.offsets }; delete o2[key]; S.offsets = o2; apply(false); commit(); renderProps(); };
    r2.append(sp, rs); box.append(row, r2);
    return box;
  }

  function stylePicker() {
    const box = document.createElement("div"); box.className = "styles"; box.dataset.key = "arriveStyle";
    ARRIVE_STYLES.forEach(([v, n]) => {
      const lb = document.createElement("label");
      const r = document.createElement("input"); r.type = "radio"; r.name = "arriveStyle"; r.value = v; r.checked = S.arriveStyle === v;
      r.onchange = () => { set("arriveStyle", v); commit(); playPreview(v); };
      const tx = document.createElement("span"); tx.textContent = n;
      const pv = document.createElement("button"); pv.className = "ghost"; pv.textContent = "Preview"; pv.title = "Play the arrival with this effect";
      pv.onclick = (e) => { e.preventDefault(); playPreview(v); };
      lb.append(r, tx, pv); box.appendChild(lb);
    });
    inputs.arriveStyle = () => box.querySelectorAll("input").forEach((r) => { r.checked = r.value === S.arriveStyle; });
    return box;
  }

  function section(def) {
    const d = document.createElement("div"); d.className = "sect";
    const h = document.createElement("h3"); h.textContent = def.title;
    if (def.shared) { const s = document.createElement("span"); s.className = "shared"; s.textContent = def.shared; h.appendChild(s); }
    d.appendChild(h);
    if (def.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = def.note; d.appendChild(n); }
    if (def.pos) {
      if (def.pos.startsWith("carry")) {
        const n = document.createElement("div"); n.className = "note";
        n.textContent = def.pos === "carry:start" ? "Used before the move. Scrub before the move to drag it." : "Used after the move. Scrub after the move to drag it.";
        d.appendChild(n); d.dataset.carry = def.pos;
      }
      d.appendChild(posRows(def.pos));
    }
    if (def.styles) d.appendChild(stylePicker());
    if (def.resetAll) {
      const n = document.createElement("div"); n.className = "note"; n.textContent = "Every label and item can be dragged on the canvas.";
      const r = document.createElement("div"); r.className = "row wide"; r.dataset.key = "offsets";
      const sp = document.createElement("span");
      const b = document.createElement("button"); b.textContent = "Reset all positions";
      b.onclick = () => { S.offsets = {}; apply(false); commit(); renderProps(); };
      r.append(sp, b); d.append(n, r);
    }
    (def.keys || []).forEach((k) => d.appendChild(control(k)));
    return d;
  }

  // Properties panel: the selection only, with Look and Motion tabs where it has both.
  function renderProps() {
    Object.keys(inputs).forEach((k) => delete inputs[k]);
    const P = PANELS(selected), tabs = Object.keys(P);
    if (!tabs.includes(tab)) tab = tabs[0];
    $("propTitle").textContent = nameOf(selected);
    const tb = $("tabs"); tb.innerHTML = ""; tb.hidden = tabs.length < 2;
    const body = $("props"); body.innerHTML = "";
    tabs.forEach((name) => {
      const b = document.createElement("button"); b.textContent = name; b.className = name === tab ? "on" : "";
      b.onclick = () => { tab = name; renderProps(); };
      tb.appendChild(b);
      const pane = document.createElement("div"); pane.dataset.tab = name; pane.hidden = name !== tab;
      P[name].forEach((def) => pane.appendChild(section(def)));
      body.appendChild(pane);
    });
    markCarrySide();
  }
  function markCarrySide() {
    const live = scene.carryKey(t);
    document.querySelectorAll("[data-carry]").forEach((d) => d.querySelector("h3").style.color = d.dataset.carry === live ? "#09c916" : "");
  }
  const sync = () => Object.values(inputs).forEach((f) => f());

  // Scene list
  const EYE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8Z" opacity=".4"/><path d="M2.5 13.5 13.5 2.5"/></svg>';
  function renderList() {
    const ul = $("list"); ul.innerHTML = "";
    OBJECTS.forEach(([id, name, child]) => {
      const li = document.createElement("li"); li.dataset.obj = id; li.setAttribute("role", "option"); li.tabIndex = 0;
      li.className = (id === selected ? "on " : "") + (child ? "child " : "") + (hidden.has(id) ? "off" : "");
      li.setAttribute("aria-selected", id === selected);
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = name; nm.title = name; li.appendChild(nm);
      if (id !== "scene") {
        const eye = document.createElement("button"); eye.className = "eye"; eye.innerHTML = hidden.has(id) ? EYE_OFF : EYE;
        eye.title = (hidden.has(id) ? "Show " : "Hide ") + name + " while editing";
        eye.onclick = (e) => { e.stopPropagation(); hidden.has(id) ? hidden.delete(id) : hidden.add(id); applyHidden(); renderList(); };
        li.appendChild(eye);
      }
      li.onclick = () => select(id);
      li.onkeydown = (e) => { if (e.key === "Enter") select(id); };
      li.onmouseenter = () => hoverMark(id, true); li.onmouseleave = () => hoverMark(id, false);
      ul.appendChild(li);
    });
  }

  // Engine elements for each object. The carried card holds ring, bar, meta, then the tag, then the arrival outlines.
  function elsOf(id) {
    const st = scene.stage, carry = st.querySelector('[data-key="this:0"]'), kids = carry ? [...carry.children] : [];
    if (id === "field") return [frame.querySelector("canvas")];
    if (id === "carry") return [carry];
    if (id === "chip") return [kids[3]];
    if (id === "arrive") return kids.slice(4);
    if (id === "scene") return [];
    return [st.querySelector(`[data-key="${id}"]`)];
  }
  function applyHidden() { OBJECTS.forEach(([id]) => elsOf(id).forEach((e) => { if (e) e.style.visibility = hidden.has(id) ? "hidden" : ""; })); }
  function hoverMark(id, on) { if (["carry", "label:this", "label:next"].includes(id) || /^(this|next):/.test(id)) elsOf(id).forEach((e) => e && e.classList.toggle("hov", on)); }
  function renderSelectionMark() {
    frame.querySelectorAll(".sel, .selarrive, .selchip").forEach((e) => e.classList.remove("sel", "selarrive", "selchip"));
    frame.classList.toggle("selfield", selected === "field");
    const carry = elsOf("carry")[0];
    if (selected === "chip") elsOf("chip")[0].classList.add("selchip");
    else if (selected === "arrive") carry.classList.add("selarrive");
    else if (selected !== "scene" && selected !== "field") elsOf(selected)[0].classList.add("sel");
  }

  function select(id) {
    if (id !== selected) { selected = id; renderProps(); }
    renderList(); renderSelectionMark(); renderBars();
  }

  // Settings changes
  function apply(rebuild = true) { scene.set(S, rebuild); fit(); applyHidden(); scene.seek(t); renderSelectionMark(); renderBars(); renderTimeline(); }
  function set(key, v) { S[key] = v; apply(true); save(); }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

  // Undo and redo, one step per finished change.
  let hist = [JSON.stringify(S)], hi = 0;
  const histUi = () => { $("undo").disabled = hi <= 0; $("redo").disabled = hi >= hist.length - 1; };
  function commit() { const s = JSON.stringify(S); if (s === hist[hi]) return; hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 200) hist.shift(); hi = hist.length - 1; save(); histUi(); }
  function restore(i) { hi = i; S = JSON.parse(hist[hi]); apply(); renderProps(); save(); histUi(); }
  $("undo").onclick = () => { if (hi > 0) restore(hi - 1); };
  $("redo").onclick = () => { if (hi < hist.length - 1) restore(hi + 1); };

  // Canvas: the frame stays centred in whatever space the panels leave.
  const stageEl = $("stage");
  function fit() {
    const w = stageEl.clientWidth - 56, h = stageEl.clientHeight - 56;
    const s = Math.max(0.05, Math.min(w / S.frameW, h / S.frameH));
    scene.resize(s, window.devicePixelRatio || 1);
    frame.dataset.scale = s;
  }
  new ResizeObserver(() => fit()).observe(stageEl);
  addEventListener("resize", () => fit());

  // Canvas selection and dragging, in step with the list.
  stageEl.addEventListener("pointerdown", (e) => {
    if (!frame.contains(e.target)) { select("scene"); return; }
    const chip = elsOf("chip")[0];
    if (chip && chip.contains(e.target)) { setPlaying(false); select("chip"); return; }
    const el = e.target.closest("[data-key]");
    if (!el) { select("field"); return; }
    e.preventDefault(); setPlaying(false);
    const id = el.dataset.key === "this:0" ? "carry" : el.dataset.key;
    select(id);
    const key = id === "carry" ? scene.carryKey(t) : id;
    const s = Number(frame.dataset.scale) || 1, sx = e.clientX, sy = e.clientY;
    const start = S.offsets[key] || { x: 0, y: 0 };
    capture(stageEl, e);
    const move = (ev) => {
      S.offsets = { ...S.offsets, [key]: { x: Math.round(start.x + (ev.clientX - sx) / s), y: Math.round(start.y + (ev.clientY - sy) / s) } };
      scene.set(S, false);
    };
    const up = () => { stageEl.removeEventListener("pointermove", move); stageEl.removeEventListener("pointerup", up); save(); commit(); renderProps(); };
    stageEl.addEventListener("pointermove", move); stageEl.addEventListener("pointerup", up);
  });

  // Panels: show or hide, and drag the edge to resize.
  const main = $("main");
  const U = (() => { try { return { l: 220, r: 320, left: true, right: true, ...JSON.parse(localStorage.getItem(UISTORE)) }; } catch (e) { return { l: 220, r: 320, left: true, right: true }; } })();
  function layout() {
    U.l = Math.min(420, Math.max(160, U.l)); U.r = Math.min(560, Math.max(260, U.r));
    main.classList.toggle("noleft", !U.left); main.classList.toggle("noright", !U.right);
    main.style.gridTemplateColumns = `${U.left ? U.l + "px 5px" : "0 0"} 1fr ${U.right ? "5px " + U.r + "px" : "0 0"}`;
    $("toggleLeft").setAttribute("aria-pressed", U.left); $("toggleRight").setAttribute("aria-pressed", U.right);
    localStorage.setItem(UISTORE, JSON.stringify(U));
    fit();
  }
  $("toggleLeft").onclick = () => { U.left = !U.left; layout(); };
  $("toggleRight").onclick = () => { U.right = !U.right; layout(); };
  $("closeLeft").onclick = () => { U.left = false; layout(); };
  $("closeRight").onclick = () => { U.right = false; layout(); };
  function dragEdge(h, side) {
    h.addEventListener("pointerdown", (e) => {
      capture(h, e); h.classList.add("drag");
      const mv = (ev) => { if (side === "l") U.l = ev.clientX - 2; else U.r = window.innerWidth - ev.clientX - 2; layout(); };
      const up = () => { h.classList.remove("drag"); h.removeEventListener("pointermove", mv); h.removeEventListener("pointerup", up); };
      h.addEventListener("pointermove", mv); h.addEventListener("pointerup", up);
    });
    h.ondblclick = () => { U[side] = side === "l" ? 220 : 320; layout(); };
  }
  dragEdge($("hl"), "l"); dragEdge($("hr"), "r");

  // Timeline: ruler to scrub, one lane per timed event.
  const lanes = $("lanes"), names = $("names"), ruler = $("ruler");
  const pct = (s) => (s / S.loop) * 100 + "%";
  const laneEls = [];
  function renderTimeline() {
    ruler.innerHTML = "";
    for (let s = 0; s <= S.loop; s += 1) {
      const i = document.createElement("i"); i.style.left = pct(s); ruler.appendChild(i);
      const sp = document.createElement("span"); sp.textContent = s + " s"; sp.style.left = pct(s); ruler.appendChild(sp);
    }
    syncTimes();
  }
  function buildLanes() {
    EVENTS.forEach((ev) => {
      const nm = document.createElement("div");
      const b = document.createElement("button"); b.className = "nm"; b.textContent = ev.name; b.onclick = () => select(ev.obj);
      nm.appendChild(b);
      const num = (key, unit) => {
        const n = document.createElement("input"); n.type = "number"; n.step = 0.05; n.dataset.key = key; n.setAttribute("aria-label", ev.name + " " + unit);
        n.onchange = () => { const v = Number(n.value); if (!isNaN(v)) { S[key] = Math.max(0, v); apply(false); save(); commit(); } };
        const u = document.createElement("span"); u.className = "u"; u.textContent = unit;
        nm.append(n, u); return n;
      };
      ev.inStart = ev.start ? num(ev.start, "at s") : null;
      ev.inDur = ev.dur ? num(ev.dur, "long s") : null;
      names.appendChild(nm);
      const lane = document.createElement("div"); lane.className = "lane";
      const tail = document.createElement("div"); tail.className = "tail";
      const bar = document.createElement("div"); bar.className = "bar" + (ev.start ? "" : " fixed"); bar.title = ev.name;
      if (ev.start && ev.dur) { const l = document.createElement("div"); l.className = "edge l"; bar.appendChild(l); }
      if (ev.dur) { const r = document.createElement("div"); r.className = "edge r"; bar.appendChild(r); }
      lane.append(tail, bar); lanes.insertBefore(lane, $("playhead"));
      ev.bar = bar; ev.tailEl = tail; ev.nameEl = nm; laneEls.push(lane);
      bar.addEventListener("pointerdown", (e) => barDrag(e, ev));
    });
  }
  function evStart(ev) { return ev.start ? S[ev.start] : ev.from(); }
  function renderBars() {
    EVENTS.forEach((ev) => {
      const a = evStart(ev), len = ev.dur ? S[ev.dur] : 0;
      ev.bar.style.left = pct(a);
      ev.bar.style.width = ev.dur ? `max(10px, ${pct(len)})` : "10px";
      if (!ev.dur) ev.bar.style.marginLeft = "-5px";
      if (ev.tail) { const end = ev.tail(); ev.tailEl.style.left = pct(a); ev.tailEl.style.width = pct(Math.max(0, end - a)); ev.tailEl.hidden = false; } else ev.tailEl.hidden = true;
      ev.bar.classList.toggle("on", ev.obj === selected);
      ev.nameEl.classList.toggle("on", ev.obj === selected);
      if (ev.inStart && document.activeElement !== ev.inStart) ev.inStart.value = S[ev.start];
      if (ev.inDur && document.activeElement !== ev.inDur) ev.inDur.value = S[ev.dur];
    });
  }
  function barDrag(e, ev) {
    e.preventDefault(); e.stopPropagation(); setPlaying(false); select(ev.obj);
    const edge = e.target.classList.contains("edge") ? (e.target.classList.contains("l") ? "l" : "r") : "body";
    if (edge === "body" && !ev.start) return;
    const w = lanes.clientWidth, x0 = e.clientX;
    const a0 = ev.start ? S[ev.start] : 0, d0 = ev.dur ? S[ev.dur] : 0;
    const bar = ev.bar; capture(bar, e); bar.style.cursor = "grabbing";
    const mv = (m) => {
      const q = m.altKey ? 0.01 : 0.05, snap = (v) => Math.round(v / q) * q;
      const dt = ((m.clientX - x0) / w) * S.loop, min = ev.minDur || 0;
      if (edge === "body") S[ev.start] = +snap(Math.min(S.loop - d0, Math.max(0, a0 + dt))).toFixed(2);
      else if (edge === "r") S[ev.dur] = +snap(Math.max(min, d0 + dt)).toFixed(2);
      else { const a = Math.min(a0 + d0 - min, Math.max(0, snap(a0 + dt))); S[ev.start] = +a.toFixed(2); S[ev.dur] = +(a0 + d0 - a).toFixed(2); }
      apply(false); save();
    };
    const up = () => { bar.style.cursor = ""; bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); commit(); };
    bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up);
  }
  ruler.addEventListener("pointerdown", (e) => {
    setPlaying(false); capture(ruler, e);
    const go = (m) => { const r = lanes.getBoundingClientRect(); t = Math.min(S.loop, Math.max(0, ((m.clientX - r.left) / r.width) * S.loop)); scene.seek(t); ui(); };
    go(e);
    const up = () => { ruler.removeEventListener("pointermove", go); ruler.removeEventListener("pointerup", up); };
    ruler.addEventListener("pointermove", go); ruler.addEventListener("pointerup", up);
  });
  function syncTimes() { $("time").textContent = t.toFixed(2) + " / " + S.loop.toFixed(1) + " s"; $("playhead").style.left = pct(t); }
  let lastSide = null;
  function ui() {
    syncTimes();
    let ph = "Fade in"; timeline(S).forEach(([n, s]) => { if (t >= s) ph = n; });
    $("phase").textContent = ph;
    const side = scene.carryKey(t); if (side !== lastSide) { lastSide = side; markCarrySide(); }
  }

  // Playback
  function setPlaying(v) { playing = v; last = null; if (!v) endPreview(); $("play").textContent = v ? "Pause" : "Play"; }
  $("play").onclick = () => setPlaying(!playing);
  const step = (d) => { setPlaying(false); t = Math.min(S.loop, Math.max(0, t + d / 60)); scene.seek(t); ui(); };
  $("back").onclick = () => step(-1);
  $("fwd").onclick = () => step(1);
  $("speed").onchange = (e) => { speed = Number(e.target.value); };
  // Preview an arrival effect once, then return to the chosen one.
  function playPreview(style) {
    preview = { end: Math.min(S.loop, land() + S.arriveDur + 0.35) };
    scene.set({ ...S, arriveStyle: style }, false); applyHidden();
    t = Math.max(0, land() - 0.15); playing = true; last = null; $("play").textContent = "Pause";
  }
  function endPreview() { if (preview) { preview = null; scene.set(S, false); applyHidden(); scene.seek(t); } }
  function frameLoop(now) {
    if (playing) {
      if (last != null) t += ((now - last) / 1000) * speed;
      last = now;
      if (preview && t >= preview.end) { t = preview.end; setPlaying(false); }
      t = t % S.loop; scene.seek(t); ui();
    }
    requestAnimationFrame(frameLoop);
  }

  // Keyboard
  addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea, select")) return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(e.shiftKey ? 10 : 1); }
    else if (e.key === "Escape") select("scene");
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); $(e.shiftKey ? "redo" : "undo").click(); }
  });

  // Copy, paste, reset
  const toast = (m) => { const el = $("toast"); el.textContent = m; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => { el.style.opacity = 0; }, 1800); };
  const openPaste = (v) => { $("pastebar").classList.toggle("open", v); $("pasteBtn").setAttribute("aria-expanded", v); $("pasteMsg").textContent = ""; fit(); };
  $("copy").onclick = async () => {
    const json = JSON.stringify(S, null, 2);
    try { await navigator.clipboard.writeText(json); toast("Settings copied. Paste them into the chat."); }
    catch (e) { openPaste(true); $("pasteText").value = json; $("pasteText").select(); toast("Selected. Press Cmd C."); }
  };
  $("pasteBtn").onclick = () => { const open = !$("pastebar").classList.contains("open"); openPaste(open); if (open) $("pasteText").focus(); };
  $("pasteCancel").onclick = () => openPaste(false);
  $("pasteLoad").onclick = () => {
    try {
      const o = JSON.parse($("pasteText").value);
      const next = clone(DEFAULTS); Object.keys(DEFAULTS).forEach((k) => { if (k in o) next[k] = o[k]; });
      S = next; apply(); renderProps(); commit(); openPaste(false); toast("Settings loaded");
    } catch (e) { $("pasteMsg").textContent = "That is not valid settings JSON."; }
  };
  $("resetAll").onclick = () => { S = clone(DEFAULTS); apply(); renderProps(); commit(); toast("Back to the starting values. Undo brings yours back."); };

  // Check used by the build gate: selects every object and tab, and lists any setting with no control.
  window.fbCoverage = () => {
    const seen = new Set(), was = selected, wasTab = tab;
    OBJECTS.forEach(([id]) => { selected = id; renderProps(); $("props").querySelectorAll("[data-key]").forEach((e) => seen.add(e.dataset.key)); });
    names.querySelectorAll("[data-key]").forEach((e) => seen.add(e.dataset.key));
    selected = was; tab = wasTab; renderProps();
    const keys = Object.keys(DEFAULTS), missing = keys.filter((k) => !seen.has(k));
    return { total: keys.length, covered: keys.length - missing.length, missing };
  };
  window.fbEditor = { select, get selected() { return selected; }, get settings() { return S; }, seek: (s) => { setPlaying(false); t = s; scene.seek(t); ui(); } };

  buildLanes(); layout(); renderList(); renderProps(); apply(false); ui(); histUi();
  document.fonts.ready.then(() => scene.seek(t));
  requestAnimationFrame(frameLoop);
</script>
</body>
</html>
