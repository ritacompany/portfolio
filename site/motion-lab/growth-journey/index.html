<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Journey dates</title>
<style>
  html, body { margin: 0; background: #080908; }
  #c { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #080908; display: grid; place-items: center; }
  /* Screen fitted to the frame, keeping the 961.997 x 541.123 ratio of his frame. */
  .screen { position: relative; width: min(100vw, calc(100vh * 961.997 / 541.123)); aspect-ratio: 961.997 / 541.123; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lit { opacity: 0; }
  .seg { position: absolute; background: #097e12; opacity: 0; }
</style>
</head>
<body>
<div id="c">
  <div class="screen" id="screen">
    <img src="base.png" alt="">
  </div>
</div>
<script type="module">
  // CS2 Growth Journey image. Style guide and states: docs/motion/growth-journey/.
  // base.png and lit.png are 3x exports of his Figma screen with the real timeline (not in git).
  import { spring, UI, TYPE, clamp } from "../../lib/motion.js";

  const W = 961.997, H = 541.123;
  const pct = (v, of) => (v / of * 100) + "%";
  const screen = document.getElementById("screen");
  const box = (x, y, w, h, cls) => {
    const el = document.createElement("div"); el.className = cls;
    Object.assign(el.style, { left: pct(x, W), top: pct(y, H), width: pct(w, W), height: pct(h, H) });
    screen.appendChild(el); return el;
  };
  // Late journey state: bars 1 to 3 are solid in the file, bar 4 (Branding to Opportunity) is dashed.
  // Bar 4 measured from the export: line from y 332.33 to 334.67, dashes at the x spans below.
  const BX = 701.6, BT = 332.2, BL = 25.9, BH = 2.6;
  const DOTS = [[701.6, 703.8], [708.2, 712.4], [716.9, 721.1], [725.2, 727.5]];
  const dots = DOTS.map(([a, b]) => box(a, BT, b - a, BH, "seg"));
  const line = box(BX, BT, BL, BH, "seg");
  // Lit layers cut from lit.png: the Journey target tile and Opportunity's target date.
  const inset = (x, y, w, h) => `inset(${pct(y, H)} ${pct(W - x - w, W)} ${pct(H - y - h, H)} ${pct(x, W)})`;
  const layer = (clip) => {
    const im = document.createElement("img"); im.src = "lit.png"; im.alt = ""; im.className = "lit";
    im.style.clipPath = clip; screen.appendChild(im); return im;
  };
  const litTile = layer(inset(495, 47, 114, 75.2));
  const litDate = layer(inset(755, 428.5, 29, 15.5));

  // The dots turn green one after another, the solid line flashes in, and on that beat
  // Opportunity's target and the Journey target light together. Nothing pauses between steps.
  const DOT0 = 0.6, DOTSTEP = 0.14, LINE = DOT0 + 4 * DOTSTEP + 0.02, LIT = LINE + 0.08, OFF = 3.9, DUR = 5.0;
  const on = (t, at, p = TYPE) => (t >= at ? clamp(spring(t - at, p.k, p.d)) : 0);
  window.seek = (t) => {
    t = ((t % DUR) + DUR) % DUR;
    const keep = 1 - on(t, OFF);
    dots.forEach((d, j) => { d.style.opacity = String(on(t, DOT0 + j * DOTSTEP) * keep); });
    line.style.opacity = String(on(t, LINE, UI) * keep);
    const v = String(on(t, LIT) * keep);
    litTile.style.opacity = v; litDate.style.opacity = v;
  };

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches || location.search.includes("still");
  window.seek(still ? 3.0 : 0);
  if (!window.__RENDER__ && !still) {
    const t0 = performance.now();
    const loop = (now) => { window.seek((now - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
