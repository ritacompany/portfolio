<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Falling behind, Drift</title>
<style>
  @font-face { font-family: "Plex Mono FB"; font-weight: 700; src: url("assets/IBMPlexMono-Bold.ttf") format("truetype"); }
  html, body { margin: 0; background: #0b0b0c; }
  #c { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #0b0b0c; }
  #field { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .art { position: absolute; left: 50%; top: 50%; width: 720px; height: 680px; transform-origin: 0 0; }
  .label { position: absolute; font: 700 20px/1 "Plex Mono FB", ui-monospace, monospace; color: #09c916; white-space: nowrap; }
  .card { position: absolute; left: 0; top: 0; width: 300px; height: 56px; box-sizing: border-box; display: flex; align-items: center;
    gap: 12px; padding: 0 16px; border: 1px solid #26262a; border-radius: 12px; background: #141416; transform-origin: 50% 50%; }
  .ring { flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #4a4a50;
    display: flex; align-items: center; justify-content: center; }
  .ring svg { width: 50%; height: 50%; }
  .bar { flex: none; height: 9px; border-radius: 5px; background: #2a2a2e; }
  .meta { margin-left: auto; flex: none; height: 7px; width: 34px; border-radius: 4px; background: #202023; }
  .chip { position: absolute; right: 14px; top: 19px; font: 700 9px/1 "Plex Mono FB", ui-monospace, monospace; letter-spacing: 0.12em;
    padding: 4px 6px; border-radius: 4px; border: 1px solid #e31ecf; color: #e31ecf; background: #1d0c1b; transform-origin: 100% 50%; }
  .trace { position: absolute; left: 0; top: 0; width: 300px; height: 56px; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="c"><canvas id="field"></canvas><div class="art" id="art"></div></div>
<script type="module">
  // Media for the CS2 Falling behind block, direction Drift. Style guide, state list and review log:
  // docs/motion/cs2-falling-behind-drift/. A field of white pixels drifts left to right behind two weeks side
  // by side; the open item is tagged for rollover, travels into next week and becomes the active item.
  // Every value is a function of t through window.seek(t). Add ?still for the reduced motion frame.
  import { spring, cubicBezier, clamp, lerp, range, rng, UI, TYPE } from "../lib/motion.js";

  const DUR = 8;
  const W = 720, H = 680, L = 40, R = 380, ROW = 56, STEP = 64, TOP = 226, TO_ROWS = 44;
  const rowY = (k) => TOP + TO_ROWS + k * STEP;
  const C = { card: "#26262a", lifted: "#4a4a50", ring: "#4a4a50", done: "#78b765", magenta: "#e31ecf", outline: "#3da342", green: "#09c916" };
  const FADE = { k: 400, d: 40 };
  const carryEase = cubicBezier(0.65, 0, 0.35, 1), landEase = cubicBezier(0.2, 0.8, 0.2, 1);
  const T = { check: 0.9, dim: 1.15, tag: 1.7, lift: 2.5, move: 2.7, moveDur: 1.05, shift: 2.95, land: 3.75, close: 4.0, ripple: 0.04, out: 6.9 };

  // The field. Stars live on a 360 px tile that repeats across the frame; far ones cross it once per loop,
  // near ones twice, and twinkle a whole number of times, so frame 8 s equals frame 0.
  const P = 360, stars = [];
  const r = rng(11);
  for (let i = 0; i < 150; i += 1) {
    const near = i >= 110;
    stars.push({ x: r() * P, y: r() * H, size: near ? (r() < 0.3 ? 3 : 2) : (r() < 0.5 ? 1 : 2), cycles: near ? 2 : 1,
      a: near ? 0.45 + r() * 0.4 : 0.12 + r() * 0.25, tw: 1 + Math.floor(r() * 3), ph: r() * Math.PI * 2,
      trail: near && r() < 0.3 ? 10 + Math.round(r() * 18) : 0 });
  }
  const canvas = document.getElementById("field"), ctx = canvas.getContext("2d");
  let S = 1, OX = 0, OY = 0;
  function drawField(t) {
    ctx.fillStyle = "#0b0b0c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const x0 = (s.x + (s.cycles * P * t) / DUR) % P;
      const a = s.a * (0.65 + 0.35 * Math.sin((2 * Math.PI * s.tw * t) / DUR + s.ph));
      for (let j = -1; j < 3; j += 1) {
        const x = x0 + j * P;
        if (x < -40 || x > W + 4) continue;
        const px = Math.round(OX + x * S), py = Math.round(OY + s.y * S), sz = Math.max(1, Math.round(s.size * S));
        if (s.trail) {
          const len = Math.round(s.trail * S);
          const g = ctx.createLinearGradient(px - len, 0, px, 0);
          g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, `rgba(255,255,255,${a * 0.5})`);
          ctx.fillStyle = g; ctx.fillRect(px - len, py + Math.floor(sz / 2), len, Math.max(1, Math.round(S)));
        }
        ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(px, py, sz, sz);
      }
    }
  }

  const art = document.getElementById("art");
  const tick = '<svg viewBox="0 0 10 10"><path d="M2 5.2 4.2 7.4 8 2.8" fill="none" stroke="#0b0b0c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function add(cls, html) { const d = document.createElement("div"); d.className = cls; if (html) d.innerHTML = html; art.appendChild(d); return d; }
  function card(w) { return add("card", `<div class="ring">${tick}</div><div class="bar" style="width:${w}%"></div><div class="meta"></div>`); }
  const labThis = add("label"); labThis.textContent = "This week"; labThis.style.left = L + "px"; labThis.style.top = TOP + "px";
  const labNext = add("label"); labNext.textContent = "Next week"; labNext.style.left = R + "px"; labNext.style.top = TOP + "px";
  const nextRows = [40, 60, 48].map(card);
  const thisRows = [52, 44, 58].map(card);
  const carry = thisRows[0];
  carry.style.zIndex = 5;
  const chip = document.createElement("div"); chip.className = "chip"; chip.textContent = "ROLLOVER"; carry.appendChild(chip);
  const NS = "http://www.w3.org/2000/svg";
  const trace = document.createElementNS(NS, "svg"); trace.setAttribute("class", "trace"); trace.setAttribute("viewBox", "0 0 300 56");
  const rect = document.createElementNS(NS, "rect");
  Object.entries({ x: 0.75, y: 0.75, width: 298.5, height: 54.5, rx: 11.25, fill: "none", stroke: C.outline, "stroke-width": 1.5, pathLength: 1, "stroke-dasharray": 1 })
    .forEach(([k, v]) => rect.setAttribute(k, v));
  trace.appendChild(rect); carry.appendChild(trace);

  function hex(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function mix(a, b, k) { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); }
  function ring(c, { done = 0, pop = 1, green = 0 }) {
    const el = c.firstElementChild;
    el.style.background = done ? C.done : "transparent";
    el.style.borderColor = done ? C.done : mix(C.ring, C.green, green);
    el.style.borderWidth = lerp(1.5, 3, green) + "px";
    el.firstElementChild.style.opacity = done ? 1 : 0;
    el.style.transform = `scale(${done ? lerp(0.6, 1, pop) : lerp(1, 1.12, green * (1 - green) * 4 * 0.5)})`;
  }
  function place(c, x, y, op, sc = 1, shadow = 0, border = C.card) {
    c.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
    c.style.opacity = op; c.style.borderColor = border;
    c.style.boxShadow = shadow > 0.001 ? `0 ${16 * shadow}px ${36 * shadow}px rgba(0,0,0,${0.6 * shadow})` : "none";
  }

  window.seek = (t) => {
    t = ((t % DUR) + DUR) % DUR;
    drawField(t);
    const vis = spring(t, FADE.k, FADE.d) * (1 - spring(t - T.out, FADE.k, FADE.d));
    labThis.style.opacity = vis; labNext.style.opacity = vis;
    const gap = (i) => STEP * spring(t - T.close - i * T.ripple, TYPE.k, TYPE.d);

    // This week: row 2 finished from the start, row 3 is checked at 0.9 s; both close up once the top one leaves.
    thisRows.forEach((c, p) => {
      if (p === 0) return;
      const at = p === 1 ? -10 : T.check;
      const done = t >= at ? 1 : 0;
      ring(c, { done, pop: spring(t - at, UI.k, UI.d) });
      const dim = lerp(1, 0.4, spring(t - (p === 1 ? -10 : T.dim), TYPE.k, TYPE.d));
      // Dim the contents, not the card, so the field never shows through a finished row.
      place(c, L, rowY(p) - gap(p - 1), vis, 1, 0, mix("#0b0b0c", C.card, dim));
      c.style.background = mix("#0b0b0c", "#141416", lerp(1, 0.55, (1 - dim) / 0.6));
      [...c.children].forEach((e) => { e.style.opacity = dim; });
    });

    // The tagged item: chip in, lift, carry right, land, outline draws in.
    const tag = spring(t - T.tag, UI.k, UI.d), untag = spring(t - T.land, TYPE.k, TYPE.d);
    chip.style.opacity = tag * (1 - untag);
    chip.style.transform = `scale(${lerp(0.85, 1, tag)})`;
    carry.querySelector(".meta").style.opacity = 1 - tag * (1 - untag);
    const la = spring(t - T.lift, UI.k, UI.d);
    const raw = clamp((t - T.move) / T.moveDur), land = landEase(range(raw, 0.6, 1));
    const x = lerp(L, R, carryEase(raw));
    const y = rowY(0) - 6 * la * (1 - land);
    const sc = lerp(lerp(1, 1.04, la), 1, land);
    const tint = mix(C.card, C.magenta, 0.45 * tag * (1 - untag));
    const border = mix(mix(tint, C.lifted, la * (1 - land) * 0.5), C.card, land);
    const draw = spring(t - T.land, 60, 15.5);
    rect.setAttribute("stroke-dashoffset", String(1 - draw));
    rect.style.opacity = draw > 0.001 ? 1 : 0;
    ring(carry, { green: spring(t - T.land - 0.15, UI.k, UI.d) });
    place(carry, x, y, vis, sc, la * (1 - land), border);

    // Next week steps down to make room, bottom row first; its last row makes way so the week stays at three.
    nextRows.forEach((c, k) => {
      ring(c, {});
      const sh = spring(t - T.shift - (2 - k) * T.ripple, TYPE.k, TYPE.d);
      const drop = k === 2 ? spring(t - T.shift, TYPE.k, TYPE.d) : 0;
      place(c, R, lerp(rowY(k), rowY(k + 1), sh), vis * (1 - drop), lerp(1, 0.96, drop));
    });
  };

  let current = 0;
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
    const s = Math.min(innerWidth / W, innerHeight / H);
    art.style.transform = `translate(-50%, -50%) scale(${s})`; art.style.transformOrigin = "50% 50%";
    art.style.left = "50%"; art.style.top = "50%"; art.style.marginLeft = "0"; art.style.marginTop = "0";
    S = s * dpr; OX = (canvas.width - W * S) / 2; OY = (canvas.height - H * S) / 2;
    window.seek(current);
  }
  const still = new URLSearchParams(location.search).has("still") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seek0 = window.seek;
  window.seek = (t) => { current = t; seek0(t); };
  addEventListener("resize", fit);
  window.ready = document.fonts.load('700 20px "Plex Mono FB"');
  fit();
  window.seek(still ? 5 : 0);
  if (!window.__RENDER__ && !still) {
    const t0 = performance.now();
    const loop = (now) => { window.seek((now - t0) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
