<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wide Mondai index study</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="mondai-index-study.css">
  </head>
  <body>
    <main class="mondai-study" aria-labelledby="mondai-title">
      <header class="mondai-header">
        <h1 class="mondai-title figma-text" id="mondai-title">
          <span class="tracking-m">M</span><span>ond</span><span class="tracking-a">a</span><span>i</span>
        </h1>
        <div class="header-details">
          <div class="mondai-label" aria-label="case study collection">
            <img src="assets/bracket-left.svg" alt="">
            <span class="label-text figma-text">case study<br>collection</span>
            <img src="assets/bracket-right.svg" alt="">
          </div>
          <p class="mondai-description figma-text">An AI powered tech career navigator designed for the next generation of hustlers.</p>
        </div>
      </header>

      <ol class="case-list">
        <li id="leadership-case">
          <a href="#leadership-case" aria-label="View Leadership case study">
            <span class="case-number figma-text">1</span>
            <span class="case-title figma-text">Leadership CS</span>
            <img class="case-arrow" src="assets/arrow.svg" alt="">
          </a>
        </li>
        <li id="framework-case">
          <a href="#framework-case" aria-label="View Framework case study">
            <span class="case-number figma-text">2</span>
            <span class="case-title figma-text">Framework CS</span>
            <img class="case-arrow" src="assets/arrow.svg" alt="">
          </a>
        </li>
        <li id="design-system-case">
          <a href="#design-system-case" aria-label="View Design system case study">
            <span class="case-number figma-text">3</span>
            <span class="case-title figma-text">Design system CS</span>
            <img class="case-arrow" src="assets/arrow.svg" alt="">
          </a>
        </li>
      </ol>
    </main>
  </body>
</html>
