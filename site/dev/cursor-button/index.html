<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor button tuner</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/cursor-button.css">
<script src="/dev/preview/edit-panel.js" data-fluid defer></script>
<style>
  /* Tuner for the cursor button (docs/motion/cursor-button/). Not shipped. The live page code is
     site/js/cursor-button.js, loaded here unchanged; the panel writes into its config. */
  :root { color-scheme: dark; }
  body { background: var(--neutral-900); color: var(--neutral-100); margin: 0; container-type: inline-size; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 24px 96px; display: grid; gap: 48px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  @container (max-width: 700px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  h1 { grid-column: 1 / -1; font: var(--body-20); letter-spacing: var(--body-20-track); color: var(--neutral-300); margin: 0; }
  .card { display: flex; flex-direction: column; gap: 20px; color: inherit; text-decoration: none; }
  .card__t { font: var(--body-20); letter-spacing: var(--body-20-track); color: var(--neutral-050); }
  .media { position: relative; display: block; overflow: hidden; background: var(--neutral-700); }
  .media img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Hover either image. Press and hold to see the pressed state.</h1>
    <a class="card" href="#" onclick="return false">
      <span class="card__t">Home, Mondai card</span>
      <span class="media" data-cursor="View collection"><img src="/assets/home/mondai-card@2x.webp" alt="" width="879" height="580"></span>
    </a>
    <a class="card" href="#" onclick="return false">
      <span class="card__t">Collection, Framework CS card</span>
      <span class="media" data-cursor="View case study"><img src="/assets/collection/framework-preview.png" alt="" width="394" height="469"></span>
    </a>
  </main>
<script src="/js/cursor-button.js"></script>
<script>
  // Panel: every value he would feel, written straight into the shipped config
  const C = window.CursorButton.config;
  const set = (k) => (v) => { C[k] = v; if (k === "followK") { C.followD = 2 * Math.sqrt(v); } };
  const def = {
    id: "cursor-button", title: "Cursor button", tab: "Motion",
    note: "Copy values gives the numbers for site/js/cursor-button.js.",
    controls: [
      { key: "followK", label: "Follow stiffness", hint: "Higher sticks closer to the pointer; damping stays critical, so it never overshoots", min: 80, max: 1200, step: 10, value: 320, default: 320, onInput: set("followK") },
      { key: "enterK", label: "Grow in", hint: "Higher appears faster", min: 60, max: 800, step: 10, value: 200, default: 200, onInput: set("enterK") },
      { key: "leaveK", label: "Shrink out", hint: "Higher goes faster", min: 60, max: 1200, step: 10, value: 420, default: 420, onInput: set("leaveK") },
      { key: "from", label: "Grows from", min: 0.2, max: 1, step: 0.02, value: 0.6, default: 0.6, onInput: set("from") },
      { key: "press", label: "Pressed size", min: 0.85, max: 1, step: 0.01, value: 0.96, default: 0.96, onInput: set("press") },
    ],
  };
  window.EditPanel ? window.EditPanel.register(def) : (window.EditPanelQueue ||= []).push(def);

  // Render mode: a scripted pointer through the right hand card, window.seek(t) paints moment t.
  window.seek = (t) => {
    const z = document.querySelectorAll("[data-cursor]")[1], r = z.getBoundingClientRect();
    const el = window.__seekBtn ||= (() => { const b = window.CursorButton.makeButton(); b.textContent = z.dataset.cursor; return b; })();
    const ease = (a) => a * a * (3 - 2 * a), seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
    const path = (t) => {
      let x, y;
      if (t < 1.6) { const p = ease(seg(t, 0, 1.6)); x = r.left - 60 + p * (r.width * 0.5 + 60); y = r.top + r.height * 0.45; }
      else if (t < 2.6) { x = r.left + r.width * 0.5; y = r.top + r.height * 0.45; }
      else { const p = ease(seg(t, 2.6, 4.1)); x = r.left + r.width * (0.5 + 0.3 * p); y = r.top + r.height * (0.45 + 0.65 * p); }
      const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      return { x, y, inside, down: t >= 2.2 && t < 2.5 };
    };
    const s = window.CursorButton.simulate(path, t, matchMedia("(prefers-reduced-motion: reduce)").matches);
    window.CursorButton.paint(el, s, path(t).down && path(t).inside, false);
  };
</script>
</body>
</html>
