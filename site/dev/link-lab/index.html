<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Link states lab</title>
  <link rel="preload" href="/assets/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/satoshi-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css" data-site>
  <link rel="stylesheet" href="/css/base.css" data-site>
  <link rel="stylesheet" href="/css/components.css" data-site>
  <link rel="stylesheet" href="/dev/link-lab/lab.css">
</head>
<body class="lab">
  <header class="lab-bar">
    <button class="lab-btn lab-icon" id="tgl-left" aria-expanded="true" aria-controls="lab-left" title="Show or hide the component list">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h12"/></svg>
    </button>
    <h1>Link states lab</h1>
    <div class="lab-seg" id="mode" role="group" aria-label="Pointer">
      <button data-v="mouse">Mouse<span class="long">, 1200 and up</span></button>
      <button data-v="touch">Touch<span class="long">, phone and tablet</span></button>
    </div>
    <div class="lab-seg" id="view" role="group" aria-label="Values">
      <button data-v="tuned">Your values</button>
      <button data-v="site">Live site</button>
    </div>
    <div class="lab-seg" id="zoom" role="group" aria-label="Zoom">
      <button data-v="1">1x</button>
      <button data-v="2">2x</button>
      <button data-v="4">4x</button>
    </div>
    <span class="lab-bar__fill"></span>
    <button class="lab-btn" id="copy">Copy values</button>
    <button class="lab-btn lab-icon" id="tgl-right" aria-expanded="true" aria-controls="lab-right" title="Show or hide the tuning panel">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 12h10"/><circle cx="6" cy="4" r="1.6"/><circle cx="10" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <div class="lab-body">
    <nav class="lab-left" id="lab-left" aria-label="Components">
      <p class="lab-left__head">Components</p>
      <ul id="list"></ul>
    </nav>

    <main id="stage" class="lab-stage" aria-label="Link states"></main>

    <aside class="lab-right" id="lab-right" aria-label="Tuning">
      <div class="lab-drag" id="drag" title="Drag to resize"></div>
      <div class="lab-right__scroll" data-scroll-ok>
        <div class="lab-right__head">
          <p>Tuning</p>
          <button class="lab-link" id="reset-all">Reset all</button>
        </div>
        <div id="knobs"></div>
        <label class="lab-notes">
          <span>Notes for Claude</span>
          <textarea id="notes" rows="4" placeholder="Anything you want to say with the values"></textarea>
        </label>
      </div>
    </aside>
  </div>

  <div class="lab-toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/dev/link-lab/lab.js"></script>
</body>
</html>
