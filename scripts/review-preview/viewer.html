<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one quiet toolbar over a device stage; the page renders at a true CSS width, scaled to fit */
:root {
  --bg: #0e0e10; --bar: #161618; --line: #26262a; --fg: #e8e8ea; --muted: #8b8b93; --chip: #1f1f23; --on: #f1f1f3; --on-fg: #111113;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-bottom: 1px solid var(--line); }
.name { font-weight: 600; letter-spacing: 0.01em; }
.widths { display: flex; flex-wrap: wrap; gap: 6px; }
.widths button { font: inherit; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.widths button small { color: var(--muted); margin-left: 6px; font-size: 11px; }
.widths button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: var(--on); }
.widths button[aria-pressed="true"] small { color: #55555c; }
.widths button:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
.info { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.stage { flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; padding: 16px; }
.frame { transform-origin: top center; box-shadow: 0 0 0 1px var(--line); background: #18181b; flex: none; }
iframe { display: block; border: 0; width: 100%; height: 100%; }
@media (max-width: 640px) { .info { margin-left: 0; width: 100%; } }
</style>

<div class="bar">
  <span class="name">__NAME__</span>
  <div class="widths" id="widths" role="group" aria-label="Viewport width"></div>
  <span class="info" id="info"></span>
</div>
<div class="stage" id="stage"><div class="frame" id="frame"><iframe id="page" src="page.html" title="__NAME__ page"></iframe></div></div>

<script>
const W = [[390, "phone"], [768, "tablet"], [1440, "desktop"]];
const box = document.getElementById("widths"), frame = document.getElementById("frame"),
      stage = document.getElementById("stage"), info = document.getElementById("info");
let cur = 768;
try { cur = +localStorage.getItem("review-w") || 768; } catch (e) {}
if (![390, 768, 1440].includes(cur)) cur = 768;
function mode(w) { return w < 768 ? "phone layout" : w < 1160 ? "tablet layout (768 to 1159)" : "desktop layout (1160 up)"; }
function fit() {
  const avail = stage.clientWidth - 32, h = stage.clientHeight - 32;
  const s = Math.min(1, avail / cur);
  frame.style.width = cur + "px";
  frame.style.height = (h / s) + "px";
  frame.style.transform = `scale(${s})`;
  frame.style.marginBottom = `${-(h / s) * (1 - s)}px`;
  info.textContent = `${cur} px, ${mode(cur)}${s < 1 ? `, shown at ${Math.round(s * 100)}%` : ""}`;
}
function pick(w) {
  cur = w;
  try { localStorage.setItem("review-w", w); } catch (e) {}
  box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.w === w));
  fit();
}
for (const [w, l] of W) {
  const b = document.createElement("button");
  b.dataset.w = w; b.innerHTML = `${w}<small>${l}</small>`;
  b.onclick = () => pick(w);
  box.appendChild(b);
}
addEventListener("resize", fit);
pick(cur);
</script>
