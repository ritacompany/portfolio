<style>
:root{--bg:#fafafa;--fg:#1c1d20;--mute:#6a6e75;--track:#d5d8dd;--acc:#2f6fdb;--warn:#c2410c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--fg:#ececee;--mute:#9a9ea5;--track:#3a3e44;--acc:#7aa7ff;--warn:#fb8c4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141517;--fg:#ececee;--mute:#9a9ea5;--track:#3a3e44;--acc:#7aa7ff;--warn:#fb8c4c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1040px;margin:0 auto} h1{font-size:20px;margin:0 0 6px} p{margin:0;color:var(--mute);max-width:72ch}
figure{margin:24px 0 0;overflow-x:auto} figcaption{color:var(--mute);margin-top:12px;max-width:72ch}
svg{min-width:760px;width:100%;height:auto;display:block} svg text{font:13px system-ui,sans-serif;fill:var(--fg)} svg text.b{font-weight:600} svg text.m{font-size:12px;fill:var(--mute)} svg text.q{font-weight:600;fill:var(--warn)}
.g{stroke:var(--track)} .trk{stroke:var(--track);stroke-width:2} .done{fill:var(--acc)} .chk{fill:none;stroke:var(--bg);stroke-width:2}
.open{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 4} .miss{fill:var(--bg);stroke:var(--warn);stroke-width:2} .end{stroke:var(--fg);stroke-width:2}
</style>
<main><h1>Falling behind, the bridge image</h1>
