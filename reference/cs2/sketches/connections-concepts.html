<title>Connections sketches</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#fafafa;--fg:#1c1d20;--mute:#74777d;--todo:#e2e3e6;--done:#5d6168;--now:#eef0f3;--gap:#c2410c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--fg:#ececee;--mute:#8d9097;--todo:#2c2e32;--done:#a9adb4;--now:#1f2124;--gap:#fb8c4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141517;--fg:#ececee;--mute:#8d9097;--todo:#2c2e32;--done:#a9adb4;--now:#1f2124;--gap:#fb8c4c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1000px;margin:0 auto;display:grid;gap:56px}
h1{font-size:20px;margin:0 0 6px} h2{font-size:16px;margin:0 0 4px} p{margin:0;color:var(--mute);max-width:72ch}
figure{margin:16px 0 0;overflow-x:auto} figcaption{color:var(--mute);margin-top:10px;max-width:72ch}
svg{min-width:720px;width:100%;height:auto;display:block;color:var(--fg)}
svg text{font:12px system-ui,sans-serif;fill:var(--fg)} svg text.mute{fill:var(--mute)} svg text.strong{font-weight:600}
svg text.gapt{fill:var(--gap);font-weight:600}
.rule{stroke:var(--mute);stroke-width:1} .now{fill:var(--now);stroke:var(--mute);stroke-dasharray:3 3}
.done{fill:var(--done)} .todo{fill:var(--todo);stroke:var(--mute);stroke-width:.6}
.target{stroke:var(--fg);stroke-width:2} .pace{stroke:var(--fg);stroke-width:2;stroke-dasharray:3 3}
.gap{stroke:var(--gap);stroke-width:3} .br{fill:none;stroke:var(--mute);stroke-width:1} .fork{fill:none;stroke:currentColor;stroke-width:1.3}
</style>

<header><h1>Connections block, concept 1 redrawn</h1><p>The route as one line of Action Items laid along the weeks. Two takes of the same idea, one with light labels and one barer. The three first sketches are in git history.</p></header>
