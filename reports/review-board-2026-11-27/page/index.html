<title>Portfolio review board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=IBM+Plex+Sans+Mono:wght@400;500&display=swap">
<style>
/* One item at a time: a slim list of items on the left (collapsible), the work under review in the middle, the
   decision panel on the right (collapsible). Dark, quiet, square. */
:root {
  --bg: #050506; --panel: #0e0e10; --panel-2: #151518; --line: #2a2a2f; --line-2: #3a3a40;
  --fg: #ecebf2; --fg-2: #b9b8c2; --fg-3: #8d8c96;
  --ok: #7fcf8a; --warn: #e3b866; --no: #e38a7f;
  --sans: "Heebo", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Sans Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg-2); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

.app { min-height: 100vh; }
.zoom[hidden] { display: none; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
.top .count { font-family: var(--mono); font-size: 13px; color: var(--fg-2); }
.top .spacer { flex: 1; }
.top .saved { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); padding: 7px 12px; border-radius: 0; font-size: 14px; }
.btn:hover { background: #1d1d21; border-color: #55555c; }
.btn:active { background: #26262b; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { border-color: var(--fg-2); }
.iconbtn { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; }

.body { display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px; align-items: start; }
.app.list-closed .body { grid-template-columns: 0 minmax(0, 1fr) 360px; }
.app.panel-closed .body { grid-template-columns: 260px minmax(0, 1fr) 0; }
.app.list-closed.panel-closed .body { grid-template-columns: 0 minmax(0, 1fr) 0; }
.list, .panel { min-width: 0; overflow: auto; background: var(--panel); position: sticky; top: calc(55px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 55px - env(safe-area-inset-top, 0px)); min-height: calc(100vh - 55px - env(safe-area-inset-top, 0px)); }
.list { border-right: 1px solid var(--line); }
.panel { border-left: 1px solid var(--line); }
.app.list-closed .list, .app.panel-closed .panel { visibility: hidden; border: 0; }

.list ol { list-style: none; margin: 0; padding: 8px 0; }
.list .group { font-family: var(--mono); font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 16px 6px; }
.list button { width: 100%; text-align: left; display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; padding: 9px 16px; background: none; border: 0; border-left: 2px solid transparent; color: var(--fg-2); }
.list button:hover { background: var(--panel-2); color: var(--fg); }
.list button[aria-current="true"] { border-left-color: var(--fg); background: var(--panel-2); color: var(--fg); }
.dot { width: 10px; height: 10px; margin-top: 6px; border: 1px solid var(--fg-3); }
.dot.approve { background: var(--ok); border-color: var(--ok); }
.dot.changes { background: var(--warn); border-color: var(--warn); }
.dot.reject { background: var(--no); border-color: var(--no); }
.dot.pick { background: var(--fg); border-color: var(--fg); }

.stage { min-width: 0; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.kicker { font-family: var(--mono); font-size: 12px; color: var(--fg-3); letter-spacing: .04em; }
.stage h2 { margin: 0; font-size: 26px; font-weight: 500; line-height: 1.25; text-wrap: balance; }
.what { margin: 0; color: var(--fg-2); max-width: 70ch; }
.visual { display: grid; gap: 16px; }
.visual.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.visual.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
figure .frame { background: #000; border: 1px solid var(--line); padding: 12px; display: grid; place-items: center; cursor: zoom-in; }
figure img { display: block; max-width: 100%; height: auto; }
figcaption { font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
.textpairs { display: grid; gap: 10px; }
.tp { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); background: var(--panel); }
.tp .k { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
.tp .was { color: var(--fg-3); }
.tp .now { color: var(--fg); }
.tp .lbl { display: block; font-family: var(--mono); font-size: 11px; color: var(--fg-3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
.nav { display: flex; gap: 8px; align-items: center; }
.nav .hint { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }

.panel-inner { padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 18px; }
.panel h3 { margin: 0; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
.rec { border: 1px solid var(--line-2); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.rec b { font-weight: 600; }
.rec p { margin: 0; color: var(--fg-2); }
.facts { margin: 0; padding-left: 18px; color: var(--fg-2); display: flex; flex-direction: column; gap: 4px; }
.choices { display: flex; flex-direction: column; gap: 6px; }
.choice { text-align: left; display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 0; }
.choice:hover { border-color: #66666d; }
.choice[aria-pressed="true"] { border-color: var(--fg); background: #1e1e22; }
.choice .box { width: 14px; height: 14px; margin-top: 4px; border: 1px solid var(--fg-3); }
.choice[aria-pressed="true"] .box { background: var(--fg); border-color: var(--fg); }
.choice small { display: block; color: var(--fg-3); font-size: 13px; }
label.note { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 0; padding: 10px; line-height: 1.45; }
textarea:focus { border-color: var(--fg-2); outline: none; }
.where { font-family: var(--mono); font-size: 12px; color: var(--fg-3); word-break: break-word; }
.where a { color: var(--fg-2); }

.done { border: 1px solid var(--line-2); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.done p { margin: 0; color: var(--fg-2); }

.zoom { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); display: grid; place-items: center; overflow: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.zoom img { max-width: none; width: auto; max-height: none; }
.zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); }

@media (max-width: 1100px) {
  .body { grid-template-columns: 220px minmax(0, 1fr) 320px; }
  .app.list-closed .body { grid-template-columns: 0 minmax(0, 1fr) 320px; }
  .app.panel-closed .body { grid-template-columns: 220px minmax(0, 1fr) 0; }
}
@media (max-width: 820px) {
  .body, .app.list-closed .body, .app.panel-closed .body, .app.list-closed.panel-closed .body { display: flex; flex-direction: column; }
  .list, .panel { position: static; max-height: none; min-height: 0; }
  .list { border-right: 0; border-bottom: 1px solid var(--line); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .app.list-closed .list, .app.panel-closed .panel { display: none; }
  .visual.two, .visual.three { grid-template-columns: minmax(0, 1fr); }
  .tp { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .choice, .btn, .list button { transition: background-color .12s, border-color .12s; } }
</style>

<div class="app" id="app">
  <header class="top">
    <button class="btn iconbtn" id="toggle-list" aria-label="Hide the list of items" aria-expanded="true" title="Hide or show the list">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg>
    </button>
    <h1>Portfolio review board</h1>
    <span class="count" id="count">0 of 0 answered</span>
    <span class="spacer"></span>
    <span class="saved" id="saved" aria-live="polite">Your answers save as you go</span>
    <button class="btn primary" id="finish">Send to Claude</button>
    <button class="btn iconbtn" id="toggle-panel" aria-label="Hide the decision panel" aria-expanded="true" title="Hide or show the decision panel">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11"/><line x1="10" y1="2.5" x2="10" y2="13.5"/></svg>
    </button>
  </header>
  <div class="body">
    <nav class="list" id="list" aria-label="Items to review" data-scroll-ok></nav>
    <main class="stage" id="stage"></main>
    <aside class="panel" id="panel" aria-label="Your decision" data-scroll-ok></aside>
  </div>
</div>
<div class="zoom" id="zoom" hidden><button class="btn close" id="zoom-close">Close</button><img id="zoom-img" alt=""></div>

<script>
const APPROVE = [
  { v: "approve", t: "Approve", s: "Ship it as shown" },
  { v: "changes", t: "Approve with changes", s: "Say what in the note" },
  { v: "reject", t: "Reject", s: "Leave it out" },
];
const ITEMS = [
  // Already said yes: these only wait to go into the site.
  { id: "sow-tablet", group: "You already said yes, approve to put them in", kicker: "Framework case study · tablet · PR #35",
    title: "Start of week carousel on a tablet",
    what: "On a tablet the five Start of week cards had shrunk to about two thirds size, so their text was too small to read. Now they show at desktop size, with a soft fade over the side cards. You said yes to this on 21 Nov.",
    visual: { kind: "two", imgs: [["img/sow-tablet-before.webp", "Before, at 768 wide"], ["img/sow-tablet-after.webp", "After, at 768 wide"]] },
    rec: ["Approve", "It is the version you approved in preview on 21 Nov. All its page checks pass."],
    choices: APPROVE },
  { id: "sow-copy", group: "You already said yes, approve to put them in", kicker: "Framework case study · Start of week · PR #38",
    title: "Shorter Start of week card descriptions",
    what: "The text under four of the five Start of week cards is shorter, so it runs two lines on desktop and three on a phone instead of four or five. Clean slate is unchanged. You said yes on 21 Nov.",
    visual: { kind: "text", pairs: [
      ["Catching up", "Finishing every Action Item doesn’t close the gap for a user who is behind, so this screen shows how many days they made up last week and points them to finishing early until they’re back on target.", "A user who is behind sees how many days they made up last week and how finishing early closes the rest of the gap."],
      ["Rollover", "When a week ends unfinished, the Rollover Action Items wait in the new week under a magenta tag. The screen shows where the pace landed and what carried over, so the plan never changes unseen.", "Unfinished Action Items wait in the new week under a magenta tag. The screen shows the new pace, so the plan never changes unseen."],
      ["Recalibration", "Rollover handles one unfinished week. When it keeps happening, the screen suggests a capacity that fits the hours the user has been giving. They can take it, set their own or skip it with a warning.", "After weeks under about half the hours they set, this screen suggests a capacity that fits. They can take it or keep their plan."],
      ["Reset", "After a long absence, the old plan is too far behind to catch up to, so the week rebuilds from today with their progress kept. It has one button, because most users would pick keep my plan just because it’s the default.", "After a long absence, the week rebuilds from today and keeps their progress. It has one button, so keep my plan can’t win by default."],
    ] },
    rec: ["Approve", "Every line was checked against the Mondai product archive. The old Recalibration text said users could skip it with a warning, which the product does not do; the new text matches."],
    choices: APPROVE },
  { id: "fw-fixes", group: "You already said yes, approve to put them in", kicker: "Framework case study · fixes · PR #37",
    title: "Framework fixes from your 21 Nov review",
    what: "Two fixes from your notes. The Target and pace picture was blank on a tablet in your preview link; it now loads everywhere. The Rescheduling picture had a new export under the old file name, so some browsers kept the old one; it has a new name. On a tablet the Schedule view text now breaks into balanced lines with no one word last line.",
    visual: { kind: "one", imgs: [["img/schedule-768-after.webp", "Schedule view at 768 wide, after the fix"]] },
    rec: ["Approve", "Both are bug fixes to what you already approved. One small thing left alone: at 1440 one line of the Rescheduling text breaks a word later than your Figma frame. Say so in the note if you want it matched exactly."],
    choices: APPROVE },
  { id: "headlines", group: "Needs your call", kicker: "Framework case study · tablet · PR #36",
    title: "Framework headlines run three lines on a tablet",
    what: "You asked on 21 Nov for headlines to run three lines on a tablet. Today some run two lines on a wide tablet and Calendar setup runs four. Each headline now gets its own width, so every one runs three lines from 768 to 1159 wide. Phone and desktop do not change.",
    visual: { kind: "stack", imgs: [["img/hl-cal-before.webp", "Calendar setup at 1024 wide, now: four lines"], ["img/hl-cal-after.webp", "Calendar setup at 1024 wide, proposed: three lines"], ["img/hl-time-before.webp", "Personalized timeline at 1024 wide, now: two lines"], ["img/hl-time-after.webp", "Personalized timeline at 1024 wide, proposed: three lines"]] },
    rec: ["Approve", "Measured at every width from 768 to 1159 for all 14 headlines: all run three lines. Each one breaks where it breaks in your 1440 frame."],
    choices: APPROVE },
  { id: "footer", group: "Needs your call", kicker: "Framework case study · footer · PR #25",
    title: "Footer wording",
    what: "A line by line edit of the footer words in your current frame. The footer’s one real job is telling a hiring manager where you are and what you want. Only the changed lines are listed.",
    visual: { kind: "textshot", img: ["img/footer-1440.webp", "The footer on the page today, 1440 wide"], pairs: [
      ["Location, grey line", "I’m currently living in Chicago, IL", "I live in Chicago."],
      ["Location, white line", "and seeking opportunities in NYC.", "I’m looking for product design roles in New York."],
      ["Button", "CONTACT", "Email me"],
      ["Nav link", "Selected works", "Work"],
      ["Bottom row", "@2026, Chadwick FENNER · 10:24pm CST · Linkedin", "© 2026 Chadwick Fenner · 10:24pm in Chicago · LinkedIn"],
      ["Case study strip", "Explore more case studies · MONDAI: DESIGN SYSTEM CASE STUDY · HAVEN: LGBTQIA + youth app", "More case studies · Mondai: design system · Haven: LGBTQIA+ youth app"],
    ] },
    rec: ["Approve", "Fixes real slips (the @ sign for ©, Linkedin, the spaced +) and makes the white line a full sentence. The one line only you can confirm: that you want product design roles in New York."],
    choices: APPROVE },
  { id: "collection", group: "Needs your call", kicker: "Mondai collection page · PR #30",
    title: "Mondai collection page",
    what: "The page you land on from the Mondai card on Home, built from your Figma frame “Mondai case study collection”. It shows the Mondai wordmark, then the Framework case study (live) and the Operations and Design system case studies marked coming soon. The picture boxes hold their size until your images are ready. The older list version is gone.",
    visual: { kind: "two", imgs: [["img/collection-1440.webp", "Desktop, 1440 wide"], ["img/collection-390.webp", "Phone, 390 wide"]] },
    rec: ["Approve", "It matches your frame within 2 px at 1440. The cursor button that came with this PR is replaced by the site cursor you picked on 21 Nov, so only the page itself is up for approval here."],
    choices: APPROVE },
  { id: "transition", group: "Needs your call", kicker: "Home to Mondai collection · PR #39",
    title: "How the Mondai card opens the collection page",
    what: "Three ways the page change from Home to the collection page can move. Each strip reads left to right, top to bottom, about one second in all. In every version the word Mondai grows into the page’s wordmark.",
    visual: { kind: "stack", imgs: [["img/transition-A.webp", "A, title: the pages fade through black while Mondai grows"], ["img/transition-B.webp", "B, card: the card picture travels into the Framework card’s spot"], ["img/transition-C.webp", "C, open: the card grows to fill the screen, then fades into the page"]] },
    rec: ["B, card", "The picture you clicked stays in view and lands where the case study it leads to sits, so the move explains itself. A is the plainest; C covers the most screen."],
    choices: [
      { v: "A", t: "A, title", s: "Fade through black, Mondai grows" },
      { v: "B", t: "B, card", s: "Card travels to the Framework spot" },
      { v: "C", t: "C, open", s: "Card fills the screen" },
      { v: "other", t: "Other", s: "Say what in the note" },
    ] },
  { id: "hero-colour", group: "Needs your call", kicker: "Home hero illustration",
    title: "Hero illustration colour",
    what: "The hero drawing is redrawn with every part you picked (pipe, planter, connector, cords, spring, box, coral and flowers). Three colour versions of the same drawing. It is not on the site yet.",
    visual: { kind: "three", imgs: [["img/hero-a-periwinkle.webp", "A, periwinkle"], ["img/hero-b-pink.webp", "B, pink"], ["img/hero-c-green.webp", "C, green"]] },
    rec: ["Your taste", "If I had to pick: B, pink. It is the only one not close to a colour a case study already uses (Mondai green, Haven violet)."],
    choices: [
      { v: "A", t: "A, periwinkle", s: "" },
      { v: "B", t: "B, pink", s: "" },
      { v: "C", t: "C, green", s: "" },
      { v: "other", t: "Other", s: "Say what in the note" },
    ] },
  { id: "registry", group: "Behind the scenes", kicker: "How Claude finds your Figma · PR #27",
    title: "One list of where each Figma design lives",
    what: "On 20 Nov a session looked in the wrong Figma file, hit a seat limit and told you Figma was blocked. This keeps one list of the current file and frame for each page, and stops a session from saying Figma is blocked before it has tried the right file. You said yes on 21 Nov. Nothing on the site changes.",
    visual: null,
    rec: ["Approve", "It is a fix to how sessions work, already agreed. Nothing visible changes."],
    choices: APPROVE },
  { id: "review-preview", group: "Behind the scenes", kicker: "How you get previews · PR #24",
    title: "Previews at phone, tablet and desktop in one link",
    what: "You asked on 20 Nov that the way you reviewed the framework page becomes the standard: the real page in one link, with a button each for phone (390), tablet (768) and desktop (1440). This makes it the standard for every session. Nothing on the site changes.",
    visual: null,
    rec: ["Approve", "It is your own ask from 20 Nov, written down so every session does it."],
    choices: APPROVE },
  { id: "go-live", group: "Last step", kicker: "Everything above",
    title: "Put everything approved on the main branch",
    what: "Your approved work sits on side branches. The main branch is what goes live, and nothing since 21 Nov is on it yet. When you approve this, a session puts everything you approved on this board onto main in one go, runs every check and tells you what is in. It does not put the site on your domain yet; that is a separate step.",
    visual: null,
    rec: ["Approve", "All the work is checked and green. Until it is on main, there is no single place that shows your whole site."],
    choices: APPROVE },
];

let db = null, state = {}, current = 0, finished = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function answered(id) { return !!(state[id] && state[id].choice); }
function dotClass(id) {
  const c = state[id] && state[id].choice; if (!c) return "";
  if (c === "approve" || c === "changes" || c === "reject") return c;
  return "pick";
}
function choiceLabel(it, v) { const c = it.choices.find((x) => x.v === v); return c ? c.t : ""; }

function renderList() {
  let html = "", last = "";
  ITEMS.forEach((it, i) => {
    if (it.group !== last) { if (last) html += "</ol>"; html += `<div class="group">${esc(it.group)}</div><ol>`; last = it.group; }
    html += `<li><button data-i="${i}" aria-current="${i === current}"><span class="dot ${dotClass(it.id)}" aria-hidden="true"></span><span>${esc(it.title)}</span></button></li>`;
  });
  $("#list").innerHTML = html + "</ol>";
  $("#list").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(+b.dataset.i)));
  const n = ITEMS.filter((it) => answered(it.id)).length;
  $("#count").textContent = `${n} of ${ITEMS.length} answered`;
}

function fig(src, cap) { return `<figure><div class="frame" data-zoom="${esc(src)}"><img src="${esc(src)}" alt="${esc(cap)}" loading="lazy"></div><figcaption>${esc(cap)}</figcaption></figure>`; }
function pairs(ps) { return `<div class="textpairs">` + ps.map(([k, a, b]) => `<div class="tp"><div class="k">${esc(k)}</div><div class="was"><span class="lbl">Now</span>${esc(a)}</div><div class="now"><span class="lbl">Proposed</span>${esc(b)}</div></div>`).join("") + `</div>`; }

function renderStage() {
  const it = ITEMS[current];
  let v = "";
  if (it.visual) {
    const k = it.visual.kind;
    if (k === "two") v = `<div class="visual two">${it.visual.imgs.map(([s, c]) => fig(s, c)).join("")}</div>`;
    else if (k === "three") v = `<div class="visual three">${it.visual.imgs.map(([s, c]) => fig(s, c)).join("")}</div>`;
    else if (k === "one" || k === "stack") v = `<div class="visual">${it.visual.imgs.map(([s, c]) => fig(s, c)).join("")}</div>`;
    else if (k === "text") v = pairs(it.visual.pairs);
    else if (k === "textshot") v = pairs(it.visual.pairs) + `<div class="visual">${fig(it.visual.img[0], it.visual.img[1])}</div>`;
  }
  $("#stage").innerHTML = `<div class="stage-inner">
    <div class="nav"><button class="btn" id="prev" ${current === 0 ? "disabled" : ""}>Previous</button><button class="btn" id="next" ${current === ITEMS.length - 1 ? "disabled" : ""}>Next</button><span class="hint">${current + 1} of ${ITEMS.length} · arrow keys move between items</span></div>
    <div class="kicker">${esc(it.kicker)}</div>
    <h2>${esc(it.title)}</h2>
    <p class="what">${esc(it.what)}</p>
    ${v}
  </div>`;
  $("#prev").addEventListener("click", () => go(current - 1));
  $("#next").addEventListener("click", () => go(current + 1));
  $("#stage").querySelectorAll("[data-zoom]").forEach((f) => f.addEventListener("click", () => openZoom(f.dataset.zoom)));
  window.scrollTo(0, 0);
}

function renderPanel() {
  const it = ITEMS[current], s = state[it.id] || {};
  const doneN = ITEMS.filter((x) => answered(x.id)).length;
  let finishBox = "";
  if (doneN === ITEMS.length) finishBox = `<div class="done"><h3>All answered</h3><p>${finished ? "Sent to Claude. You can still change any answer; send again after." : "Press Send to Claude at the top when you are ready. Your answers are already saved."}</p></div>`;
  $("#panel").innerHTML = `<div class="panel-inner">
    <div class="rec"><h3>My recommendation</h3><b>${esc(it.rec[0])}</b><p>${esc(it.rec[1])}</p></div>
    <div><h3 id="choose-h">Your answer</h3></div>
    <div class="choices" role="group" aria-labelledby="choose-h">${it.choices.map((c) => `<button class="choice" data-v="${esc(c.v)}" aria-pressed="${s.choice === c.v}"><span class="box" aria-hidden="true"></span><span>${esc(c.t)}${c.s ? `<small>${esc(c.s)}</small>` : ""}</span></button>`).join("")}</div>
    <div><label class="note" for="note">Note (optional, for any answer)</label><textarea id="note" placeholder="What to change, a question or anything else">${esc(s.note || "")}</textarea></div>
    ${finishBox}
    ${doneN < ITEMS.length ? `<div class="where">${ITEMS.length - doneN} still open. Unanswered items have an empty square in the list.</div>` : ""}
  </div>`;
  $("#panel").querySelectorAll(".choice").forEach((b) => b.addEventListener("click", () => save(it.id, { choice: s.choice === b.dataset.v ? null : b.dataset.v })));
  let t = null;
  $("#note").addEventListener("input", (e) => { clearTimeout(t); const val = e.target.value; t = setTimeout(() => save(it.id, { note: val }, true), 500); });
}

function render() { renderList(); renderStage(); renderPanel(); }
function go(i) { if (i < 0 || i >= ITEMS.length) return; current = i; try { localStorage.setItem("rb-current", String(i)); } catch (e) {} render(); }

async function save(id, patch, quiet) {
  state[id] = Object.assign({}, state[id] || {}, patch, { at: new Date().toISOString() });
  if (!quiet) { renderList(); renderPanel(); } else renderList();
  try { localStorage.setItem("rb-state", JSON.stringify(state)); } catch (e) {}
  if (!db) { $("#saved").textContent = "Saved in this browser only"; return; }
  $("#saved").textContent = "Saving";
  try {
    const it = ITEMS.find((x) => x.id === id);
    await db.doc("decisions/" + id).set({ item: it.title, choice: state[id].choice || null, choice_label: state[id].choice ? choiceLabel(it, state[id].choice) : null, note: state[id].note || "", at: state[id].at });
    $("#saved").textContent = "Saved";
  } catch (e) { $("#saved").textContent = "Could not save; your answer is kept in this browser"; }
}

async function finish() {
  const n = ITEMS.filter((it) => answered(it.id)).length;
  if (!db) { $("#saved").textContent = "Cannot send from here; your answers are kept in this browser"; return; }
  try {
    finished = new Date().toISOString();
    await db.doc("meta/finish").set({ at: finished, answered: n, total: ITEMS.length });
    $("#saved").textContent = n === ITEMS.length ? "Sent to Claude" : `Sent to Claude, ${ITEMS.length - n} still open`;
    renderPanel();
  } catch (e) { $("#saved").textContent = "Could not send; try again"; }
}

function openZoom(src) { $("#zoom-img").src = src; $("#zoom").hidden = false; $("#zoom-close").focus(); }
function closeZoom() { $("#zoom").hidden = true; }
$("#zoom").addEventListener("click", closeZoom);
$("#finish").addEventListener("click", finish);
function toggle(cls, btn, label) {
  const app = $("#app"); app.classList.toggle(cls);
  const closed = app.classList.contains(cls);
  btn.setAttribute("aria-expanded", String(!closed));
  btn.setAttribute("aria-label", (closed ? "Show " : "Hide ") + label);
  try { localStorage.setItem("rb-" + cls, closed ? "1" : "0"); } catch (e) {}
}
$("#toggle-list").addEventListener("click", (e) => toggle("list-closed", e.currentTarget, "the list of items"));
$("#toggle-panel").addEventListener("click", (e) => toggle("panel-closed", e.currentTarget, "the decision panel"));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#zoom").hidden) { closeZoom(); return; }
  if (e.target.closest("textarea, input")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(current - 1); }
});

try { const s = JSON.parse(localStorage.getItem("rb-state") || "{}"); if (s && typeof s === "object") state = s; } catch (e) {}
try { const c = +localStorage.getItem("rb-current"); if (c >= 0 && c < ITEMS.length) current = c; } catch (e) {}
{ let lc = null; try { lc = localStorage.getItem("rb-list-closed"); } catch (e) {}
  if (lc === "1" || (lc === null && matchMedia("(max-width: 820px)").matches)) toggle("list-closed", $("#toggle-list"), "the list of items"); }
try { if (localStorage.getItem("rb-panel-closed") === "1") toggle("panel-closed", $("#toggle-panel"), "the decision panel"); } catch (e) {}
render();

(async () => {
  if (!window.claude || !window.claude.use) return;
  db = await window.claude.use("db");
  if (!db) { $("#saved").textContent = "Saved in this browser only"; return; }
  try {
    const snap = await db.collection("decisions").get();
    snap.docs.forEach((d) => { const v = d.data() || {}; const local = state[d.id]; if (!local || (v.at && (!local.at || v.at > local.at))) state[d.id] = { choice: v.choice || null, note: v.note || "", at: v.at }; });
    const f = await db.doc("meta/finish").get(); const fv = f.data(); if (fv) finished = fv.at;
    render();
    $("#saved").textContent = "Your answers save as you go";
  } catch (e) { $("#saved").textContent = "Saved in this browser only"; }
})();
</script>
